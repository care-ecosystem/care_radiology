openapi: 3.0.3
info:
  title: CARE Radiology - External Modalities API
  version: 0.1.0
  description: |
    Endpoints the DICOM Enabler calls to discover the modality devices of a facility and to
    connect one of them to itself.

    A device is listed only when its status is `active` and `available` and it is not already
    connected to another DICOM Enabler. Once a device is connected to an enabler it no longer
    appears in the list returned to other enablers.

    Authentication follows the existing `/external/worklist/` endpoint: the
    `Authorization` header carries the shared secret (`CARE_RADIOLOGY_WEBHOOK_SECRET`).

servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: https://care.example.org

security:
  - StaticApiKey: []

tags:
  - name: Modalities

paths:
  /api/care_radiology/facility/{facility_external_id}/external/modalities/:
    get:
      tags: [Modalities]
      operationId: listAvailableModalities
      summary: List modality devices available for a DICOM Enabler
      description: |
        Returns the facility's modality devices whose status is `active` and `available`
        and that are not connected to another DICOM Enabler.

        A device already connected to the calling enabler (`dicom_enabler_id`) is still
        returned, so the enabler can re-read its own configuration.
      parameters:
        - $ref: "#/components/parameters/FacilityId"
        - name: dicom_enabler_id
          in: query
          required: true
          description: Identifier of the calling DICOM Enabler.
          schema:
            type: string
            example: enabler-ward-3-pc01
        - name: modality
          in: query
          required: false
          description: Restrict results to one DICOM modality code.
          schema:
            type: string
            example: CT
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 15
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Available modality devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModalityListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/care_radiology/facility/{facility_external_id}/external/modalities/{device_external_id}/connect/:
    post:
      tags: [Modalities]
      operationId: connectModality
      summary: Connect a modality device to a DICOM Enabler
      description: |
        Marks the device as connected to the given DICOM Enabler. After this call the device is
        excluded from `GET .../external/modalities/` for every other enabler.

        Calling it again with the same `dicom_enabler_id` is idempotent and returns `200`.
        Calling it for a device connected to a different enabler returns `409`.
      parameters:
        - $ref: "#/components/parameters/FacilityId"
        - $ref: "#/components/parameters/DeviceExternalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectModalityRequest"
      responses:
        "200":
          description: Device is connected to the enabler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectModalityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Device is already connected to another DICOM Enabler, or is no longer `active` / `available`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Device is already connected to another DICOM Enabler.

components:
  securitySchemes:
    StaticApiKey:
      type: apiKey
      in: header
      name: Authorization

  parameters:
    FacilityId:
      name: facility_external_id
      in: path
      required: true
      description: Facility ID (UUID).
      schema:
        type: string
        format: uuid
    DeviceExternalId:
      name: device_external_id
      in: path
      required: true
      description: External ID (UUID) of the modality device.
      schema:
        type: string
        format: uuid

  schemas:
    DeviceStatus:
      type: object
      required: [status, availability_status]
      properties:
        status:
          type: string
          description: Lifecycle status of the device. Only `active` devices are listed.
          enum: [active, inactive, entered_in_error]
          example: active
        availability_status:
          type: string
          description: Availability of the device. Only `available` devices are listed.
          enum: [available, lost, damaged, destroyed]
          example: available

    DicomEndpoint:
      type: object
      required: [ae_title, port]
      properties:
        ae_title:
          type: string
          maxLength: 16
          example: CT_STORE_SCP
        host:
          type: string
          description: Host name or IP address, when configured on the device.
          example: 192.168.1.40
        port:
          type: integer
          minimum: 1
          maximum: 65535
          example: 104

    Modality:
      type: object
      required:
        - device_external_id
        - device_name
        - modality
        - store_scp
        - modality_scp
        - device_status
      properties:
        device_external_id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        device_name:
          type: string
          example: Siemens SOMATOM CT
        modality:
          type: string
          description: DICOM modality code.
          example: CT
        store_scp:
          description: Modality Store SCP - where the DICOM Enabler sends images (C-STORE).
          allOf:
            - $ref: "#/components/schemas/DicomEndpoint"
        modality_scp:
          description: Modality SCP - the AE title and port the modality uses to query the worklist (MWL) and report MPPS.
          allOf:
            - $ref: "#/components/schemas/DicomEndpoint"
          example:
            ae_title: CT_MWL_SCU
            host: 192.168.1.40
            port: 11112
        device_status:
          $ref: "#/components/schemas/DeviceStatus"
        connected_dicom_enabler_id:
          type: string
          nullable: true
          description: Enabler the device is connected to; `null` when not yet connected. Only ever the caller's own ID in list responses.
          example: null

    ModalityListResponse:
      type: object
      required: [count, results]
      properties:
        count:
          type: integer
          description: Total results across all pages, not just this page's.
          example: 1
        results:
          type: array
          items:
            $ref: "#/components/schemas/Modality"

    ConnectModalityRequest:
      type: object
      required: [dicom_enabler_id]
      properties:
        dicom_enabler_id:
          type: string
          description: Identifier of the DICOM Enabler claiming the device.
          example: enabler-ward-3-pc01

    ConnectModalityResponse:
      type: object
      required: [device_external_id, dicom_enabler_id, connected_at]
      properties:
        device_external_id:
          type: string
          format: uuid
        dicom_enabler_id:
          type: string
        connected_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

  responses:
    BadRequest:
      description: Missing or invalid parameter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid `Authorization` header.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Token does not match `CARE_RADIOLOGY_WEBHOOK_SECRET`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Facility or device not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
